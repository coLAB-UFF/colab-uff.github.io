<!doctype html>
<html lang="{{ site.lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">

<!-- Favicon -->
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/img/favicon/favicon-16.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="48x48" href="{{ '/assets/img/favicon/favicon-48.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/img/favicon/favicon-192.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/favicon/favicon-180.png' | relative_url }}">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Unicons -->
<link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
<!-- Font Awesome 4 (usado só pelo ícone fa-external-link nos links do corpo do texto) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% seo %}
</head>
<body>

{% include header.html %}
{{ content }}
{% include footer.html %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Configuração do bloco "Board do coLAB", vinda de _data/team.yml — editável
  // sem tocar em código. Ver assets/js/main.js para a lógica de renderização.
  window.TEAM_CONFIG = {{ site.data.team.config | jsonify }};
</script>
<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
<script>
  window.NEWSLETTER_ENDPOINT = {{ site.data.site.newsletter.endpoint | jsonify }};
</script>
<script src="{{ '/assets/js/newsletter.js' | relative_url }}"></script>
{% if page.layout == "clipping-list" %}
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="{{ '/assets/js/clipping.js' | relative_url }}"></script>
{% endif %}
</body>
</html>
