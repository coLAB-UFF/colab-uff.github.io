# ==========================================================================
# Configuração geral do site coLAB
# Estes valores alimentam <title>, meta description, SEO tags e rodapé.
# ==========================================================================
title: "coLAB — Laboratório de Pesquisa em Comunicação, Culturas Políticas e Economia da Colaboração"
description: "coLAB - Laboratório de Pesquisa em Comunicação, Culturas Políticas e Economia da Colaboração."
lang: pt-BR

# Base URL do repositório quando publicado como projeto do GitHub Pages
# (ex.: "/colab-site"). Deixe em branco ("") se for um site de usuário/organização
# (ex.: usuario.github.io) ou domínio próprio.
baseurl: ""
url: "https://colab.meme"

author: "coLAB — UFF"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Habilita números de linha nos blocos de código (usado nos blocos "Como
# citar" das Publicações, para reproduzir o layout de colab.meme/ddoslab).
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: true

collections:
  projects:
    output: true
    permalink: /projetos/:path/
  publicacoes:
    output: true
    permalink: /publicacoes/:path/
  integrantes:
    output: true
    permalink: /integrantes/:path/
  apps:
    output: true
    permalink: /apps/:path/
  # Versão em inglês do site (URLs sob /en/). Mesmos layouts das coleções em
  # português; o idioma é detectado por page.lang (ver _includes/i18n.html).
  projects_en:
    output: true
    permalink: /en/projects/:path/
  publications_en:
    output: true
    permalink: /en/publications/:path/
  members_en:
    output: true
    permalink: /en/members/:path/
  apps_en:
    output: true
    permalink: /en/apps/:path/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: projeto
  - scope:
      path: ""
      type: "publicacoes"
    values:
      layout: publicacao
  - scope:
      path: ""
      type: "integrantes"
    values:
      layout: integrante
  - scope:
      path: ""
      type: "apps"
    values:
      layout: app
  - scope:
      path: ""
      type: "projects_en"
    values:
      layout: projeto
      lang: en
  - scope:
      path: ""
      type: "publications_en"
    values:
      layout: publicacao
      lang: en
  - scope:
      path: ""
      type: "members_en"
    values:
      layout: integrante
      lang: en
  - scope:
      path: ""
      type: "apps_en"
    values:
      layout: app
      lang: en
  - scope:
      path: "en"
    values:
      lang: en

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
