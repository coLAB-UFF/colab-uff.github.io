  - name: "Diretório de Grupos de Pesquisa no Brasil/CNPq"
    icon: "/assets/img/social/logo_dgp.svg"
    url: "http://dgp.cnpq.br/dgp/espelhogrupo/8743613284400394"
  - name: "Figshare"
    icon: "/assets/img/social/logo_figshare.svg"
    url: "https://figshare.com/projects/Papers_coLAB/35102"
  - name: "GitHub"
    icon: "uil-github"
    url: "https://colab-uff.github.io/data/"
  - name: "Instagram"
    icon: "uil-instagram"
    url: "https://www.instagram.com/colab.uff"

