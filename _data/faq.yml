eyebrow: "FAQ"
title: "Perguntas frequentes"
description: "Reunimos aqui as dúvidas mais comuns sobre o coLAB e nossos projetos. Se a sua pergunta não estiver aqui, use o formulário acima ou escreva para o nosso e-mail."
items:
  - question: "Posso propor uma parceria institucional com o coLAB ou contratar vocês para uma consultoria?"
    answer: 'Sim. O coLAB firma acordos de cooperação interinstitucional e também realiza consultorias pontuais, conforme disponibilidade da equipe. No caso dos convênios e parcerias, o objetivo é firmar acordos bilaterais com outros laboratórios e núcleos de pesquisa que desenvolvem investigações similares. Para tanto, os líderes de cada iniciativa devem estabelecer contato para avaliar as responsabilidades compartilhadas. No caso de consultorias ou serviços a serem prestados, os membros do coLAB podem pontualmente atuar junto a projetos parcerias mediante remuneração a título de bolsa ou pro labore. Entre em contato conosco para maiores esclarecimentos.'
  - question: "Como posso fazer parte do coLAB?"
    answer: 'O ingresso de novos integrantes costuma ocorrer por meio de editais de bolsas (iniciação científica, mestrado e doutorado) ou convite direto do coordenador. Fique de olho nas chamadas divulgadas no site e nas redes do coLAB.'
  - question: "Vocês realizam coletas de dados para terceiros? Como posso utilizar dados do coLAB em minha pesquisa?"
    answer: 'O coLAB não realiza coletas sob demanda para terceiros, mas disponibiliza publicamente parte de suas bases na página <a href="/data/">Repositórios de Dados</a>, licenciadas sob Creative Commons CC BY-NC-SA e livres para uso acadêmico com a devida citação.'
