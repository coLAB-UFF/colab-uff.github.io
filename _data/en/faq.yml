# English version of the FAQ block (contact page). "answer" accepts simple HTML.
eyebrow: "FAQ"
title: "Frequently asked questions"
description: "Here we gather the most common questions about coLAB and our projects. If your question is not listed here, use the form above or write to our e-mail."
items:
  - question: "Can I propose an institutional partnership with coLAB or hire you for consulting?"
    answer: 'Yes. coLAB enters into inter-institutional cooperation agreements and also carries out occasional consulting work, depending on the team''s availability. In the case of agreements and partnerships, the goal is to establish bilateral arrangements with other laboratories and research groups that conduct similar investigations. To that end, the leaders of each initiative should get in touch to assess shared responsibilities. In the case of consulting or services to be provided, coLAB members may occasionally work on partner projects in exchange for compensation as a scholarship or pro labore. Please contact us for further clarification.'
  - question: "How can I become part of coLAB?"
    answer: 'coLAB welcomes researchers at all levels of education (undergraduate, master''s, doctoral and postdoctoral). Participation is open and voluntary, and there are no requirements regarding specific courses or affiliations. However, research activities are regular and require in-person attendance at at least one weekly meeting at the premises of the Institute of Art and Social Communication at the Fluminense Federal University. If your specific interest is in applying for a scholarship, new scholarship-holding members are usually admitted through scholarship calls (scientific initiation, outreach, technological innovation initiation, teaching assistantship, master''s, doctoral and postdoctoral) or by direct invitation from the coordinator. Scholarship funds are scarce, and members of the laboratory itself are generally given priority. Keep an eye on the calls published on the website and on coLAB''s social media.'
  - question: "Do you collect data for third parties? How can I use coLAB data in my research?"
    answer: 'coLAB does not carry out on-demand data collection for third parties, but it makes part of its datasets publicly available on the <a href="/en/data/">Data Repositories</a> page, licensed under Creative Commons CC BY-NC-SA and free for academic use with proper citation. For cooperation proposals or service provision, see the related question in this same FAQ.'
