eyebrow: "Hello, we are coLAB/UFF"
title: "coLAB - Research Laboratory for Communication, Political Cultures and Economies of Collaboration."
description: >
  The Research Laboratory for Communication, Political Cultures and Economies of
  Collaboration (coLAB/UFF) is a research center specialized in investigations
  aimed at understanding the interfaces between digital culture and political
  culture, with an emphasis on studies of online politics, digital methods,
  disinformation and hate speech, humor and democracy, political violence on
  digital platforms, digital activism, contentious repertoires and the strategic
  uses of affordances on digital platforms, influence operations, and online
  participation, among other topics.
