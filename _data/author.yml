title: "Um pouco sobre o coLAB"
text: >
  O coLAB foi criado em 2010, e está, desde a sua origem, sediado na Universidade
  Federal Fluminense, com vinculação ao Programa de Pós-Graduação em Comunicação
  e ao Departamento de Estudos Culturais e Mídia. Saiba um pouco mais sobre nossa
  história e sobre as redes de pesquisa parceiras em que atuamos.
