<!-- ==========================================================================
     FAQ — referência: ishs2026.org (seção "FAQ"), sem o botão "All FAQ"
     (não há página dedicada de FAQ neste site). Conteúdo: _data/faq.yml —
     edite esse arquivo para alterar perguntas/respostas sem tocar no código.
     Reutilizado em duas páginas apenas: home (index.md, entre Projetos e o
     rodapé) e Fale Conosco (_layouts/fale-conosco.html, logo abaixo do
     formulário) — não incluir em outras páginas.
     Coluna esquerda: eyebrow + título + descrição. Coluna direita: acordeão
     Bootstrap 5 (usa o bootstrap.bundle.min.js já carregado em default.html).
     ========================================================================== -->
{% assign faq = site.data.faq %}
<section class="wrapper faq-section section-gap" id="faq">
  <div class="container">
    <div class="row gy-6 gx-lg-8">
      <div class="col-lg-5">
        <h2 class="eyebrow"><span class="eyebrow-dash">—</span> {{ faq.eyebrow }}</h2>
        <h3 class="display-6 mb-3">{{ faq.title }}</h3>
        <p class="mb-0">{{ faq.description }}</p>
      </div>
      <div class="col-lg-7">
        <div class="accordion faq-accordion" id="faqAccordion">
          {% for item in faq.items %}
          <div class="accordion-item">
            <h4 class="accordion-header" id="faqHeading{{ forloop.index0 }}">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#faqCollapse{{ forloop.index0 }}" aria-expanded="false" aria-controls="faqCollapse{{ forloop.index0 }}">
                {{ item.question }}
              </button>
            </h4>
            <div id="faqCollapse{{ forloop.index0 }}" class="accordion-collapse collapse" aria-labelledby="faqHeading{{ forloop.index0 }}" data-bs-parent="#faqAccordion">
              <div class="accordion-body">{{ item.answer }}</div>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</section>
