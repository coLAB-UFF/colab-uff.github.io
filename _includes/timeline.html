<!-- ==========================================================================
     Linha do Tempo do coLAB — vertical, com cards alternados (esquerda/
     direita) ao longo de uma linha central. Cada ano é um card; um ano com
     mais de um acontecimento lista vários itens expansíveis dentro do
     mesmo card (clique no título revela a descrição/foto). Um selo
     flutuante mostra o ano em foco durante a rolagem.
     Conteúdo 100% editável em _data/timeline.yml (eyebrow/title/description
     + years: [{year, events: [{title, description, image}]}], "image" é
     opcional por evento).
     Usada apenas em /sobre/ — ver _layouts/sobre.html (gated por
     page.timeline) para não aparecer também em /data/, que reusa o mesmo
     layout. Lógica de expandir/colapsar e do selo de ano em
     assets/js/main.js (initTimeline).
     ========================================================================== -->
{% assign tl = site.data.timeline %}
<section class="timeline-section section-gap animate">
  <div class="container">
    <div class="row">
      <div class="col-lg-8">
        <h2 class="eyebrow d-block"><span class="eyebrow-dash">—</span> {{ tl.eyebrow }}</h2>
        <h3 class="display-6 mb-3">{{ tl.title }}</h3>
        <p class="section__description mb-9">{{ tl.description }}</p>
      </div>
    </div>

    <div class="timeline-v" data-timeline>
      <span class="timeline-v__sticky-year" data-timeline-sticky-year>{{ tl.years.first.year }}</span>
      <div class="timeline-v__line"></div>

      {% for group in tl.years %}
      <div class="timeline-v__row timeline-v__row--{% cycle 'left', 'right' %}" data-timeline-year="{{ group.year }}">
        <div class="timeline-v__marker"><span class="timeline-v__dot"></span></div>
        <div class="timeline-v__card">
          <span class="timeline-v__year-badge"><i class="uil uil-calendar-alt"></i> {{ group.year }}</span>

          {% for ev in group.events %}
          <div class="timeline-v__event" data-timeline-event>
            <button type="button" class="timeline-v__event-toggle" data-timeline-toggle aria-expanded="false">
              <span class="timeline-v__event-title">{{ ev.title }}</span>
              <i class="uil uil-angle-down timeline-v__event-icon"></i>
            </button>
            <div class="timeline-v__event-body" data-timeline-body>
              <div class="timeline-v__event-body-inner">
                {% if ev.image %}
                <img src="{{ ev.image | relative_url }}" alt="{{ ev.title }}" class="timeline-v__event-image">
                {% endif %}
                <p>{{ ev.description }}</p>
              </div>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
